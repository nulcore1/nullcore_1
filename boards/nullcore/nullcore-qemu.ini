; QEMU-only test build of nullcore: quad PSRAM (QEMU can't emulate octal) + logs on UART0.
; NOT for flashing to the real device.
[env:nullcore-qemu]
extends = env:nullcore
board_build.arduino.memory_type = qio_qspi
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env:nullcore.build_flags}
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	-DBTN_ACT=HIGH   ; QEMU reads every GPIO as 0 -> treat 0 as "not pressed"
	-DNULLCORE_QEMU_MIRROR=1   ; stream screen draws over UART from boot (emulator screenshots)
