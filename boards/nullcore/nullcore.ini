; ============================================================
;  nullcore — ESP32-S3 N16R8 + ST7789 2.0" + physical buttons
;  DIY handheld (Bruce-based) by Fedor "nullcore"
;
;  Display ST7789 (SPI):  SCLK=12  MOSI=11  MISO=13  CS=10  DC=9  RST=14  BL=21
;  CC1101 (Sub-GHz):      shares SPI (12/13/11)  CS=15  GDO0=16
;  nRF24L01 (2.4GHz):     shares SPI (12/13/11)  CS=17  CE=18
;  PN532 (NFC, I2C):      SDA=41  SCL=42
;  Infrared:              TX=40   RX=39
;  Buttons (to GND):      UP=4  DOWN=5  LEFT=6  RIGHT=7  OK=8
; ============================================================

[env:nullcore]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/nullcore>
build_flags =
	${env.build_flags}
	-Iboards/nullcore

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_MODE=1            ; ESP32-S3 USB peripheral mode (needed for BadUSB HID)
	-DARDUINO_USB_CDC_ON_BOOT=1     ; Serial over native USB-CDC
	-DBOARD_HAS_PSRAM=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; ==================== Feature gates ====================
	-DUSB_as_HID=1                  ; BadUSB (keystroke injection) available on S3
	; No touch on this build — navigation is by physical buttons (see interface.cpp)
	-DHAS_4_BUTTONS=1               ; Prev/Next/Sel/Esc layout -> on-screen keyboard works with buttons

	; ==================== Display (TFT_eSPI, ST7789 240x320) ====================
	-DUSE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_INVERSION_ON
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=14
	-DTFT_BL=21
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTFT_BACKLIGHT_ON=HIGH
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== One-pin module defaults (IR / RF) ====================
	-DIR_TX_PINS='{{"Front IR", 40}}'
	-DIR_RX_PINS='{{"Front IR", 39}}'
	-DRF_TX_PINS='{{"CC1101", 16}}'
	-DRF_RX_PINS='{{"CC1101", 16}}'

	; ==================== Environment ====================
	-DROTATION=1
	-DBTN_ALIAS='"OK"'
	-DDEVICE_NAME='"nullcore"'
	-DDEEPSLEEP_WAKEUP_PIN=8        ; OK button wakes the device from deep sleep
	-DDEEPSLEEP_PIN_ACT=LOW
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	; ==================== nullcore customisations ====================
	-DNULLCORE_TRIM=1               ; drop menus for absent hardware (LoRa, FM, Ethernet, GPS, WireTools, Clock)
	-DNULLCORE_SIGNALPET=1          ; swap Brucegotchi attack-pet for the passive Signal Pet
	-DDEFAULT_PRICOLOR=0x96FE       ; nullcore default UI colour: Light Blue
	-DDEFAULT_SECCOLOR=0xD79F
	-DNULLCORE_CAT=1                ; cat mascot on the boot screen instead of the Bruce logo
	-DDEFAULT_MAIN_MENU_STYLE=1     ; MAIN_MENU_GRID — icon grid instead of carousel
	-DNULLCORE_TILE_FRAMES=1        ; frame each grid tile as a card

lib_deps =
	${env.lib_deps}
