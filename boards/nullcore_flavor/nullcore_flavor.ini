; ============================================================
;  nullcore flavor — «начинка» nullcore на готовых платах.
;  Добавляет к штатной плате Bruce: кота на загрузке, меню-сетку
;  плитками, игры (Jumper/Snake) и тему Light Blue.
;  Железо/пины/кнопки берутся от самой платы — ничего не ломается.
;
;  Сборка:  pio run -e nullcore-<плата>
;  Напр.:   pio run -e nullcore-t-embed
; ============================================================

; Общий набор флагов «начинки» (переиспользуется во всех env ниже).
; Не трогает пины/ввод/набор меню конкретной платы.
[nullcore_flavor]
build_flags =
	-Iboards/nullcore_flavor
	-DNULLCORE_CAT=1            ; кот на загрузке вместо лого Bruce
	-DNULLCORE_GAMES=1          ; раздел Games (Jumper, Snake)
	-DDEFAULT_MAIN_MENU_STYLE=1 ; меню-сетка плитками
	-DNULLCORE_TILE_FRAMES=1    ; рамки-карточки на плитках
	-DDEFAULT_PRICOLOR=0x96FE   ; тема Light Blue
	-DDEFAULT_SECCOLOR=0xD79F
src_filter = +<../boards/nullcore_flavor>

; ---------- LilyGO ----------
[env:nullcore-t-embed]
extends = env:lilygo-t-embed
build_flags = ${env:lilygo-t-embed.build_flags} ${nullcore_flavor.build_flags}
build_src_filter = ${env:lilygo-t-embed.build_src_filter} ${nullcore_flavor.src_filter}

[env:nullcore-t-embed-cc1101]
extends = env:lilygo-t-embed-cc1101
